<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eidan Rubio · Portfolio IPO</title>
<meta name="description" content="Portfolio digital IPO1 i Anglès — Eidan Rubio Valencia, SMX, Institut Sa Palomera">
<style>
:root{
  --bg:#0b0d14; --bg2:#121623; --card:#171c2c; --line:#262c42;
  --text:#e8eaf3; --muted:#9aa1ba; --accent:#9a8cf0; --accent2:#6fd3c4;
  --radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px}

/* NAV */
header{position:sticky;top:0;z-index:10;background:rgba(11,13,20,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.logo{font-weight:700;letter-spacing:.3px}
.logo span{color:var(--accent)}
.links{display:flex;gap:22px;font-size:.95rem}
.links a{color:var(--muted)}
.links a:hover{color:var(--text);text-decoration:none}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{background:none;border:0;color:var(--muted);padding:6px 14px;font:inherit;font-size:.85rem;cursor:pointer}
.lang button.on{background:var(--accent);color:#14102b;font-weight:700}
@media(max-width:760px){.links{display:none}}

/* HERO */
.hero{padding:90px 0 70px;background:radial-gradient(900px 400px at 80% -10%,rgba(154,140,240,.18),transparent),var(--bg)}
.hero .tag{display:inline-block;border:1px solid var(--line);color:var(--accent2);border-radius:999px;padding:4px 14px;font-size:.85rem;margin-bottom:22px}
.hero h1{font-size:clamp(2.2rem,6vw,3.8rem);line-height:1.1;margin-bottom:18px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{font-size:1.15rem;color:var(--muted);max-width:640px}
.hero .cta{margin-top:30px;display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:11px 22px;border-radius:10px;font-weight:600;border:1px solid var(--accent)}
.btn.main{background:var(--accent);color:#14102b}
.btn.ghost{color:var(--accent)}
.btn:hover{text-decoration:none;filter:brightness(1.1)}

/* SECTIONS */
section{padding:70px 0;border-top:1px solid var(--line)}
section:nth-of-type(even){background:var(--bg2)}
.num{color:var(--accent);font-weight:700;font-size:.9rem;letter-spacing:2px}
h2{font-size:1.9rem;margin:6px 0 10px}
.sub{color:var(--muted);max-width:680px;margin-bottom:34px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:1.1rem}
.card p{color:var(--muted);font-size:.95rem;flex:1}
.badge{align-self:flex-start;font-size:.75rem;border-radius:999px;padding:3px 11px;background:rgba(111,211,196,.12);color:var(--accent2);border:1px solid rgba(111,211,196,.3)}
.badge.pending{background:rgba(255,255,255,.04);color:var(--muted);border-color:var(--line)}
.card a.more{font-weight:600;font-size:.92rem}
.card .off{color:var(--muted);font-size:.9rem;opacity:.6}
.ra{font-size:2rem;font-weight:800;color:var(--accent);line-height:1}

/* ABOUT */
.about{display:grid;grid-template-columns:220px 1fr;gap:34px;align-items:center}
.photo{width:220px;height:220px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#5b4fc7);display:grid;place-items:center;font-size:4rem;font-weight:800;color:#14102b}
.about p{font-size:1.1rem}
.about p b{color:var(--accent)}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.facts span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:.88rem;color:var(--muted)}
@media(max-width:700px){.about{grid-template-columns:1fr;justify-items:center;text-align:center}.facts{justify-content:center}}

/* VIDEO */
.video{aspect-ratio:16/9;background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}

footer{padding:36px 0;text-align:center;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line)}
</style>
</head>

</main>

function setLang(l){
  if(!T[l]) l = "ca";
  document.documentElement.lang = l;
  document.querySelectorAll("[data-i18n]").forEach(e => e.textContent = T[l][e.dataset.i18n]);
  document.querySelectorAll("[data-i18n-html]").forEach(e => e.innerHTML = T[l][e.dataset.i18nHtml]);
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === l));
  try{ localStorage.setItem("lang", l); }catch(_){}
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
let saved = null;
try{ saved = localStorage.getItem("lang"); }catch(_){}
setLang(saved || "ca");
</script>
